<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- KT Initials Logo with Green Theme -->
  <defs>
    <linearGradient id="ktGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="ktGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#ktGradient)" opacity="0.15"/>
  
  <!-- K Letter -->
  <path d="M 50 40 L 50 160 M 50 100 L 90 40 M 50 100 L 90 160" 
        stroke="url(#ktGradient)" 
        stroke-width="12" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#ktGlow)"/>
  
  <!-- T Letter -->
  <path d="M 120 40 L 180 40 M 150 40 L 150 160" 
        stroke="url(#ktGradient)" 
        stroke-width="12" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#ktGlow)"/>
</svg>

